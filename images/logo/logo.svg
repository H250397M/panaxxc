<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#15803D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Hexagon/Shield -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#glowGrad)" stroke="#22C55E" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="6" y="6" width="68" height="68" rx="16" fill="#15803D" fill-opacity="0.1" />
    
    <!-- Stylized Innovation Bulb + Leaf / Circuit Nodes -->
    <path d="M40 20C30.0589 20 22 28.0589 22 38C22 43.6843 24.6469 48.7495 28.7773 52.0298C29.8458 52.8785 30.569 54.129 30.7303 55.4851L31.3 60.274C31.5432 62.3168 33.2721 63.8571 35.3262 63.8571H44.6738C46.7279 63.8571 48.4568 62.3168 48.7 60.274L49.2697 55.4851C49.431 54.129 50.1542 52.8785 51.2227 52.0298C55.3531 48.7495 58 43.6843 58 38C58 28.0589 49.9411 20 40 20Z" fill="url(#brandGrad)" />
    
    <!-- Bulb Base & Filament Accent -->
    <line x1="34" y1="67" x2="46" y2="67" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
    <path d="M35 38C35 34 38 31 42 31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Connecting Tech Nodes -->
    <circle cx="20" cy="40" r="3" fill="#22C55E" />
    <circle cx="60" cy="40" r="3" fill="#22C55E" />
    <circle cx="40" cy="14" r="3.5" fill="#34D399" />
    <line x1="23" y1="40" x2="28" y2="40" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="52" y1="40" x2="57" y2="40" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="40" y1="17.5" x2="40" y2="20" stroke="#34D399" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="104" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    INNOVATE<tspan fill="#16A34A">.</tspan>
  </text>
  <text x="105" y="74" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="2.8">
    STUDENT TECH SOCIETY
  </text>
</svg>
